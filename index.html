<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="SCTHRA explores the intersections of science, culture, technology, history, research and art. A space for knowledge, discovery and ideas.">

  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="application-name" content="SCTHRA">

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Title -->

  <!-- Canonical -->

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SCTHRA">
  <meta property="og:url" content="https://scthra.vercel.app/">
  <meta property="og:title" content="SCTHRA — Knowledge Without Boundaries">
  <meta property="og:description" content="Exploring the intersections of science, culture, technology, history, research and art.">
  <meta property="og:image" content="https://scthra.vercel.app/logo.png">
  <meta property="og:image:width" content="192">
  <meta property="og:image:height" content="192">
  <meta property="og:image:alt" content="SCTHRA logo">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SCTHRA — Knowledge Without Boundaries">
  <meta name="twitter:description" content="Science. Culture. Technology. History. Research. Art.">
  <meta name="twitter:image" content="https://scthra.vercel.app/logo.png">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Syne:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050507;
      --ink: #f3f2ee;
      --ink-soft: rgba(243, 242, 238, 0.78);
      --ink-dim: rgba(243, 242, 238, 0.44);
      --hairline: rgba(255, 255, 255, 0.11);
      --accent: #e2b857;
      --accent-soft: rgba(226, 184, 87, 0.16);
      --accent-mid: rgba(226, 184, 87, 0.36);
      --accent-glow: rgba(226, 184, 87, 0.28);
      --rose: #ff6b8b;
      --font-editorial: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
      --font-display: "Syne", sans-serif;
      --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Hide scrollbars everywhere except inside the Recommendation Affinity Drawer */
    * {
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    #affinity-drawer {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
    }

    #affinity-drawer::-webkit-scrollbar {
      display: block;
      width: 4px;
      height: 4px;
    }

    #affinity-drawer::-webkit-scrollbar-track {
      background: transparent;
    }

    #affinity-drawer::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
    }

    #affinity-drawer::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Evolving Corner Frame Geometry */
    #corner-frames {
      position: fixed;
      inset: 10px;
      pointer-events: none;
      z-index: 45;
      transition: opacity 0.3s ease;
    }

    body.reading-paused #corner-frames,
    body.reading-paused #hud-top {
      opacity: 0.14;
    }

    .c-mark {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--hairline);
      border-style: solid;
      transition: width 0.5s ease, height 0.5s ease, border-color 0.45s ease;
    }

    body[data-evo="2"] .c-mark { width: 22px; height: 22px; border-color: var(--accent-soft); }
    body[data-evo="3"] .c-mark { width: 32px; height: 32px; border-color: var(--accent-mid); }
    body[data-evo="4"] .c-mark { width: 44px; height: 44px; border-color: var(--accent); }

    .c-tl { top: 0; left: 0; border-width: 1px 0 0 1px; }
    .c-tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
    .c-bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
    .c-br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

    /* Edge-to-Edge 2px Hairline Beat Progress */
    #top-progress {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      display: flex;
      gap: 4px;
      padding: 0 2px;
      z-index: 60;
      pointer-events: none;
    }

    .prog-seg {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .prog-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      transition: width 0.06s linear, background-color 0.45s ease, box-shadow 0.45s ease;
    }

    .prog-seg.done .prog-fill {
      width: 100%;
    }

    /* Whisper-Quiet Top-Only HUD (Zero Bottom HUD, Zero Like Counters) */
    #hud-top {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 0;
      right: 0;
      height: 40px;
      padding: 0 clamp(16px, 3vw, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      transition: opacity 0.22s ease;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.24em;
      color: var(--ink);
    }

    .stage-tag {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--accent-mid);
      background: var(--accent-soft);
      color: var(--accent);
      letter-spacing: 0.16em;
      transition: border-color 0.45s ease, background-color 0.45s ease, color 0.45s ease;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: rgba(10, 10, 14, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.45s ease, color 0.45s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.45s ease;
    }

    .hud-btn:hover {
      border-color: var(--accent-mid);
    }

    .hud-btn:active {
      transform: scale(0.92);
    }

    .hud-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .hud-btn.liked {
      border-color: var(--rose);
      color: var(--rose);
      background: rgba(255, 107, 139, 0.14);
      animation: heartPop 0.38s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.24); }
      100% { transform: scale(1); }
    }

    /* Ephemeral First-Interaction Whisper */
    #gesture-whisper {
      position: fixed;
      top: max(56px, calc(env(safe-area-inset-top, 12px) + 44px));
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--ink-dim);
      background: rgba(10, 10, 14, 0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--hairline);
      padding: 6px 14px;
      border-radius: 999px;
      z-index: 55;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      white-space: nowrap;
    }

    #gesture-whisper.show {
      opacity: 1;
    }

    /* Full-Viewport Scroll-Snap Stream */
    #stream {
      width: 100%;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      touch-action: pan-y;
    }

    .reel {
      position: relative;
      width: 100%;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(54px, env(safe-area-inset-top, 54px)) clamp(16px, 4vw, 48px) max(22px, env(safe-area-inset-bottom, 22px));
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, var(--reel-tint, rgba(226, 184, 87, 0.055)) 0%, var(--bg) 76%);
    }

    /* Maximized Content Stage */
    .stage {
      width: min(94vw, 1080px);
      max-height: calc(100dvh - 82px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      pointer-events: none;
      will-change: transform;
    }

    .stage-kicker {
      font-family: var(--font-mono);
      font-size: clamp(9px, 1.3vw, 11px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: clamp(10px, 2vh, 18px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: color 0.45s ease;
    }

    .lines-stack {
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.8vh, 18px);
    }

    .reveal-line {
      opacity: 0;
      transform: translateY(12px);
      filter: blur(4px);
      transition: opacity 0.48s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.48s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.48s cubic-bezier(0.16, 1, 0.3, 1);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .reveal-line.shown {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .kw-hl {
      color: var(--accent);
      font-style: italic;
      transition: color 0.45s ease;
    }

    /* Typography Systems */
    .typo-editorial .reveal-line:first-child {
      font-family: var(--font-editorial);
      font-size: calc(clamp(28px, 4.8vw, 56px) * var(--lead-scale, 1));
      line-height: 1.14;
      letter-spacing: -0.01em;
    }
    .typo-editorial .reveal-line:not(:first-child) {
      font-family: var(--font-sans);
      font-size: clamp(16px, 2.3vw, 25px);
      line-height: 1.38;
      color: var(--ink-soft);
    }

    .typo-display .reveal-line:first-child {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: calc(clamp(24px, 4.1vw, 46px) * var(--lead-scale, 1));
      line-height: 1.18;
      letter-spacing: -0.025em;
    }
    .typo-display .reveal-line:not(:first-child) {
      font-family: var(--font-sans);
      font-size: clamp(16px, 2.2vw, 24px);
      line-height: 1.38;
      color: var(--ink-soft);
    }

    .typo-telemetry .reveal-line:first-child {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: calc(clamp(22px, 3.6vw, 40px) * var(--lead-scale, 1));
      line-height: 1.22;
      letter-spacing: -0.02em;
    }
    .typo-telemetry .reveal-line:not(:first-child) {
      font-family: var(--font-sans);
      font-size: clamp(15px, 2.1vw, 22px);
      line-height: 1.38;
      color: var(--ink-soft);
    }

    /* Split / Stacked Visual & Text Layout */
    .visual-beat-wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(14px, 2.2vh, 24px);
      align-items: center;
    }

    @media (min-width: 820px) {
      .visual-beat-wrap.has-photo {
        grid-template-columns: 1.05fr 0.95fr;
        gap: clamp(22px, 3vw, 40px);
      }
    }

    /* Uncropped Full-Fit Image Frame + Crisp White Backing for Transparent PNGs */
    .photo-frame {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      background: #0c0d12;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .photo-frame.is-png {
      background: #ffffff;
      padding: 12px;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .photo-frame.shown {
      opacity: 1;
      transform: translateY(0);
    }

    .photo-frame img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: clamp(210px, 44dvh, 420px);
      object-fit: contain;
    }

    @media (min-width: 820px) {
      .photo-frame img {
        max-height: clamp(280px, 60dvh, 560px);
      }
    }

    /* Data Visualization Cards (Earthquake Map, Market Graph, Flight Radar, Atmosphere) */
    .data-viz-card {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      background: rgba(13, 14, 20, 0.88);
      overflow: hidden;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .data-viz-card.shown {
      opacity: 1;
      transform: translateY(0);
    }

    .quake-map-wrap {
      position: relative;
      width: 100%;
      height: clamp(195px, 34dvh, 300px);
      background: #090b10;
      overflow: hidden;
    }

    .quake-tiles {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      filter: contrast(1.12) brightness(0.92);
    }

    .quake-tiles img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .quake-overlay-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .quake-pulse-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: seismicWave 2.4s infinite ease-out;
    }

    @keyframes seismicWave {
      0% { transform: scale(0.35); opacity: 0.95; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    .market-card-inner {
      padding: clamp(14px, 2.2vw, 20px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .market-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-mono);
    }

    .market-price {
      font-size: clamp(20px, 3.2vw, 30px);
      color: var(--ink);
    }

    .market-delta {
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    .market-svg {
      width: 100%;
      height: clamp(110px, 20dvh, 175px);
      display: block;
    }

    .market-foot {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--ink-dim);
    }

    .telemetry-card {
      padding: clamp(14px, 2.4vw, 22px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      border-top: 1px solid var(--hairline);
      padding-top: 12px;
      font-family: var(--font-mono);
    }

    .tele-cell-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--ink-dim);
      margin-bottom: 4px;
    }

    .tele-cell-val {
      font-size: clamp(13px, 2vw, 17px);
      color: var(--ink);
    }

    /* 3-Way Directional Swipe-Right Action Rail */
    #source-edge-glow {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: var(--accent);
      box-shadow: 0 0 24px var(--accent-glow);
      opacity: 0;
      z-index: 80;
      pointer-events: none;
      transition: opacity 0.15s ease, background-color 0.45s ease, box-shadow 0.45s ease;
    }

    #swipe-action-rail {
      position: fixed;
      top: 50%;
      left: 16px;
      transform: translateY(-50%) translateX(-130%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 85;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.16s ease;
    }

    #swipe-action-rail.visible {
      opacity: 1;
    }

    .rail-node {
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(10, 11, 16, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--hairline);
      color: var(--ink-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .rail-node.selected {
      border-color: var(--accent);
      color: var(--ink);
      background: rgba(20, 22, 30, 0.96);
      transform: translateX(8px) scale(1.04);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .rail-node[data-mode="mute"].selected {
      border-color: var(--rose);
      color: var(--rose);
    }

    /* Action Toast */
    #action-toast {
      position: fixed;
      top: max(60px, calc(env(safe-area-inset-top, 12px) + 48px));
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: 7px 15px;
      border-radius: 999px;
      background: rgba(14, 15, 21, 0.92);
      border: 1px solid var(--accent);
      box-shadow: 0 6px 24px var(--accent-glow);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      z-index: 92;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.45s ease, color 0.45s ease;
    }

    #action-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Double-Tap Resonance Pulse */
    .resonance-pulse {
      position: fixed;
      width: 96px;
      height: 96px;
      margin-left: -48px;
      margin-top: -48px;
      border-radius: 50%;
      border: 1.5px solid var(--rose);
      box-shadow: 0 0 28px rgba(255, 107, 139, 0.45);
      pointer-events: none;
      z-index: 90;
      animation: pulseExpand 0.68s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseExpand {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    /* Affinity & Saved Drawer */
    #drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.66);
      backdrop-filter: blur(8px);
      z-index: 95;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #drawer-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    #affinity-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(100vw, 400px);
      background: #0b0c10;
      border-left: 1px solid var(--hairline);
      z-index: 96;
      padding: 22px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #affinity-drawer.open {
      transform: translateX(0);
    }

    .drawer-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 18px;
    }

    .bandit-row {
      margin-bottom: 12px;
    }

    .bandit-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--ink-soft);
      margin-bottom: 5px;
    }

    .bandit-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .bandit-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease, background-color 0.45s ease;
    }

    .saved-card {
      padding: 12px;
      border: 1px solid var(--hairline);

  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
    function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    /* =========================================================================
       1. CROSS-SESSION DEDUPLICATION REGISTRY (NEVER SHOW SAME SOURCE TWICE)
       ========================================================================= */
    const SeenRegistry = {
      KEY: 'SCTHRA_seen_v2',
      seen: new Set(),

      init() {
        try {
          const raw = JSON.parse(localStorage.getItem(this.KEY) || '[]');
          raw.forEach(item => this.seen.add(item));
        } catch {
          this.seen = new Set();
        }
      },

      norm(str) {
        return String(str || '').trim().toLowerCase().replace(/\/+$/, '');
      },

      has(url, title) {
        const u = this.norm(url);
        const t = this.norm(title);
        return (u && this.seen.has(u)) || (t && this.seen.has(t));
      },

      mark(url, title) {
        const u = this.norm(url);
        const t = this.norm(title);
        if (u) this.seen.add(u);
        if (t) this.seen.add(t);
        if (this.seen.size > 3000) {
          this.seen = new Set(Array.from(this.seen).slice(-2400));
        }
        try {
          localStorage.setItem(this.KEY, JSON.stringify(Array.from(this.seen)));
        } catch {}
      }
    };

    /* =========================================================================
       2. ABBREVIATION-SAFE COMPLETE-SENTENCE DISTILLER & ANTI-REPETITION
       ========================================================================= */
    const Distiller = {
      STOPWORDS: new Set([
        'the', 'and', 'for', 'that', 'with', 'from', 'this', 'have', 'were',
        'been', 'their', 'which', 'about', 'into', 'more', 'other', 'than',
        'also', 'after', 'first', 'over', 'such', 'only', 'most', 'some', 'when'
      ]),

      clean(raw) {
        if (!raw) return '';
        const doc = new DOMParser().parseFromString(String(raw), 'text/html');
        return (doc.body.textContent || '')
          .replace(/\[\d+\]/g, '')
          .replace(/\[citation needed\]/gi, '')
          .replace(/\s+/g, ' ')
          .trim();
      },

      tokens(text) {
        return new Set(
          this.clean(text)
            .toLowerCase()
            .replace(/[^a-z0-9\s]/g, ' ')
            .split(/\s+/)
            .filter(w => w.length >= 4 && !this.STOPWORDS.has(w))
        );
      },

      isRedundant(candidate, existingTexts) {
        const candNorm = this.clean(candidate).toLowerCase();
        if (!candNorm) return true;
        const candTokens = this.tokens(candidate);
        if (candTokens.size === 0) return true;

        for (const prev of existingTexts) {
          const prevNorm = this.clean(prev).toLowerCase();
          if (!prevNorm) continue;
          if (candNorm === prevNorm || prevNorm.includes(candNorm) || candNorm.includes(prevNorm)) {
            return true;
          }
          const prevTokens = this.tokens(prev);
          let overlap = 0;
          candTokens.forEach(t => { if (prevTokens.has(t)) overlap++; });
          const ratio = overlap / Math.min(candTokens.size, prevTokens.size);
          if (ratio >= 0.65) return true;
        }
        return false;
      },

      extractCompleteSentences(raw) {
        const cleaned = this.clean(raw);
        if (!cleaned) return [];

        // Protect common abbreviations from false sentence splits
        const protectedText = cleaned
          .replace(/\b(Dr|Mr|Mrs|Ms|Prof|Sr|Jr|St|Mt|vs|etc|al|Fig|Eq|No|Vol|Dept|Univ|Inc|Ltd|Co|U\.S|U\.K|E\.U)\./gi, '$1\uE000')
          .replace(/\b([A-Z])\./g, '$1\uE000');

        const rawSentences = protectedText
          .replace(/([.!?])\s+(?=[A-Z0-9"“‘(\[])/g, '$1\uE001')
          .split('\uE001')
          .map(s => s.replace(/\uE000/g, '.').trim())
          .filter(s => {
            if (s.length < 18) return false;
            if (/^(credit|image|photo|source|doi|arxiv|isbn|issn|copyright)\b/i.test(s)) return false;
            if (/\b(subscribe|sign up|newsletter|follow us|click here|read more|all rights reserved|cookies?|advertisement|affiliate|sponsored)\b/i.test(s)) return false;
            return true;
          });

        return rawSentences.map(s => (/[.!?]$/.test(s) ? s : s + '.'));
      },

      highlightKeywords(sentence) {
        const words = sentence.split(' ');
        if (words.length < 6) return esc(sentence);
        let highlighted = 0;
        return words.map((w, idx) => {
          const stripped = w.replace(/[^A-Za-z0-9-]/g, '');
          if (idx > 0 && highlighted < 2 && stripped.length >= 7 && /^[A-Z]/.test(stripped)) {
            highlighted++;
            return `<span class="kw-hl">${esc(w)}</span>`;
          }
          return esc(w);
        }).join(' ');
      },

      computeBeatDurationMs(lines, hasVisual) {
        const chars = lines.join(' ').length;
        const base = hasVisual ? 3400 : 2800;
        return Math.min(12000, Math.max(base, base + chars * 42));
      },

      // Dynamically generates 1 to 7 slides depending on real content depth & zero repetition
      buildDynamicBeats({ kickerPrefix, title, subtitle = '', bodyText = '', hasPhoto = false }) {
        const seenInPost = [];
        const cleanTitle = this.clean(title);
        if (cleanTitle) seenInPost.push(cleanTitle);

        const allSentences = this.extractCompleteSentences(bodyText);
        const uniqueSentences = [];

        if (subtitle) {
          const cleanSub = this.clean(subtitle);
          if (cleanSub && !this.isRedundant(cleanSub, seenInPost)) {
            uniqueSentences.push(cleanSub);
            seenInPost.push(cleanSub);
          }
        }

        for (const s of allSentences) {
          if (!this.isRedundant(s, seenInPost)) {
            uniqueSentences.push(s);
            seenInPost.push(s);
          }
        }

        const beats = [];
        const beat1Lines = [cleanTitle];
        if (!hasPhoto && uniqueSentences.length > 0 && uniqueSentences[0].length < 170) {
          beat1Lines.push(uniqueSentences.shift());
        }

        beats.push({
          kicker: kickerPrefix,
          lines: beat1Lines,
          attachPhoto: hasPhoto
        });

        // Distribute remaining distinct sentences across as many slides as required (up to 7 total)
        let idx = 0;
        while (idx < uniqueSentences.length && beats.length < 7) {
          const chunk = [uniqueSentences[idx++]];
          if (idx < uniqueSentences.length && (chunk[0].length + uniqueSentences[idx].length) < 290) {
            chunk.push(uniqueSentences[idx++]);
          }
          beats.push({
            kicker: `${kickerPrefix} // ${String(beats.length + 1).padStart(2, '0')}`,
            lines: chunk,
            attachPhoto: false
          });
        }

        return beats;
      }
    };

    /* =========================================================================
       3. DYNAMIC VIEWPORT AUTO-FITTER (NEVER CLIPS SENTENCES OR IMAGES)
       ========================================================================= */
    function fitStageToViewport(stageEl, hasVisual) {
      if (!stageEl) return;
      const lineEls = Array.from(stageEl.querySelectorAll('.reveal-line'));
      const imgEl = stageEl.querySelector('.photo-frame img');

      lineEls.forEach(el => {
        el.style.fontSize = '';
        el.style.lineHeight = '';
      });
      if (imgEl) imgEl.style.maxHeight = '';

      const budget = window.innerHeight - 86;
      let guard = 0;

      while (stageEl.scrollHeight > budget && guard < 24) {
        guard++;
        if (imgEl) {
          const curImgH = parseFloat(window.getComputedStyle(imgEl).maxHeight) || 320;
          if (curImgH > 150) {
            imgEl.style.maxHeight = Math.max(150, curImgH - 22) + 'px';
          }
        }
        lineEls.forEach((el, idx) => {
          const cur = parseFloat(window.getComputedStyle(el).fontSize);
          const floor = idx === 0 ? 18 : 14;
          if (cur > floor) {
            el.style.fontSize = Math.max(floor, cur - 1.5) + 'px';
            el.style.lineHeight = '1.24';
          }
        });
      }
    }

    /* =========================================================================
       4. CONTENT-DERIVED PROCEDURAL AUDIO ENGINE (ON BY DEFAULT)
       ========================================================================= */
    const ContentAudio = {
      ctx: null,
      enabled: true,
      droneA: null,
      droneB: null,
      filter: null,
      masterGain: null,
      activeReel: null,

      SCALES: {
        NEWS: [146.83, 174.61, 220.00, 261.63, 293.66],
        AI: [164.81, 196.00, 246.94, 293.66, 369.99],
        TECH: [130.81, 155.56, 196.00, 233.08, 261.63],
        ART: [174.61, 220.00, 261.63, 329.63, 392.00],
        SCIENCE: [138.59, 164.81, 207.65, 246.94, 311.13],
        COSMOS: [130.81, 146.83, 196.00, 220.00, 293.66],
        EARTH: [123.47, 146.83, 185.00, 220.00, 277.18],
        MARKETS: [155.56, 185.00, 233.08, 277.18, 349.23],
        ARCHIVE: [164.81, 196.00, 246.94, 293.66, 329.63],
        VERSE: [146.83, 185.00, 220.00, 277.18, 329.63],
        BUSINESS: [146.83, 174.61, 220.00, 261.63, 311.13],
        HISTORY: [130.81, 155.56, 196.00, 233.08, 293.66],
        CULTURE: [146.83, 185.00, 220.00, 293.66, 369.99],
        BOOKS: [130.81, 164.81, 196.00, 246.94, 293.66]
      },

      hash(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return Math.abs(h);
      },

      unlock() {
        if (!this.ctx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return false;
          this.ctx = new Ctx();

          this.filter = this.ctx.createBiquadFilter();
          this.filter.type = 'lowpass';
          this.filter.frequency.value = 320;

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.0001;

          this.droneA = this.ctx.createOscillator();
          this.droneB = this.ctx.createOscillator();
          this.droneA.type = 'sine';
          this.droneB.type = 'triangle';
          this.droneA.frequency.value = 73.42;
          this.droneB.frequency.value = 110.0;

          this.droneA.connect(this.filter);
          this.droneB.connect(this.filter);
          this.filter.connect(this.masterGain);
          this.masterGain.connect(this.ctx.destination);

          this.droneA.start();
          this.droneB.start();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        if (this.enabled && this.masterGain) {
          this.masterGain.gain.setTargetAtTime(0.036, this.ctx.currentTime, 0.35);
        }
        return true;
      },

      toggle() {
        this.enabled = !this.enabled;
        const btn = document.getElementById('btn-sound');
        const iconOn = document.getElementById('sound-icon-on');
        const iconOff = document.getElementById('sound-icon-off');
        btn.classList.toggle('active', this.enabled);
        if (iconOn) iconOn.style.display = this.enabled ? 'block' : 'none';
        if (iconOff) iconOff.style.display = this.enabled ? 'none' : 'block';

        if (this.enabled) {
          this.unlock();
          if (this.activeReel) this.tuneToReel(this.activeReel);
        } else if (this.ctx && this.masterGain) {
          this.masterGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.2);
        }
      },

      tuneToReel(reel) {
        this.activeReel = reel;
        if (!this.enabled || !this.unlock()) return;
        const scale = this.SCALES[reel.domain] || this.SCALES.ARCHIVE;
        const h = this.hash(reel.title || reel.id);
        const now = this.ctx.currentTime;
        this.droneA.frequency.setTargetAtTime(scale[0] * 0.5, now, 0.45);
        this.droneB.frequency.setTargetAtTime(scale[(h % 3) + 1] * 0.5, now, 0.45);
        this.filter.frequency.setTargetAtTime(240 + (h % 320), now, 0.45);
      },

      playLineNote(reel, lineText, lineIndex) {
        if (!this.enabled || !reel) return;
        if (!this.ctx || this.ctx.state !== 'running') return;
        const scale = this.SCALES[reel.domain] || this.SCALES.ARCHIVE;
        const h = this.hash(lineText || String(lineIndex));
        const freq = scale[(h + lineIndex) % scale.length] * (lineIndex % 2 === 0 ? 2 : 1);

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = reel.domain === 'SCIENCE' || reel.domain === 'EARTH' ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.022, now + 0.035);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.76);
      },

      playTransitionPulse(direction = 1) {
        if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const base = direction > 0 ? 196 : 164.81;
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.exponentialRampToValueAtTime(base * 1.25, now + 0.14);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.015, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }
    };

    /* =========================================================================
       5. 100% REAL-TIME MULTI-SOURCE WEB API INGESTION ENGINE
       ========================================================================= */
    /* High-signal gate: drops clickbait, deals/promo, and title-only stubs before they reach the feed */
    const Quality = {
      SLOP: /\b(you won'?t believe|shocking|jaw-dropping|top \d+|\d+ (best|ways|things|reasons|tips|tricks)|deals?|discount|coupon|promo code|giveaway|sponsored|black friday|cyber monday|horoscope|gossip|buy now|price drop|hands-on)\b/i,
      isSlop(t) { return this.SLOP.test(String(t || '')); },
      chars(reel) { return (reel.beats || []).reduce((n, b) => n + (b.lines || []).join(' ').length, 0); },
      worthy(reel) {
        if (this.isSlop(reel.title)) return false;
        const chars = this.chars(reel);
        const visual = (reel.beats || []).some(b => b.hasVisual);
        return visual ? chars >= 40 : chars >= 120;
      },
      richness(reel) {
        const visual = (reel.beats || []).some(b => b.hasVisual) ? 0.25 : 0;
        return visual + Math.min(0.3, this.chars(reel) / 2500);
      }
    };

    const LiveWebIngestor = {
      wikiOffset: 0,
      spaceOffset: 0,
      articPage: Math.floor(Math.random() * 45) + 1,

      async getJSON(url, timeoutMs = 5200) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: ctrl.signal });
          clearTimeout(timer);
          if (!res.ok) return null;
          return await res.json();
        } catch {
          clearTimeout(timer);
          return null;
        }
      },

      async getText(url, timeoutMs = 5200) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: ctrl.signal });
          clearTimeout(timer);
          if (!res.ok) return null;
          return await res.text();
        } catch {
          clearTimeout(timer);
          return null;
        }
      },

      verifyImage(url, timeoutMs = 5200) {
        return new Promise((resolve) => {
          if (!url) return resolve(null);
          const img = new Image();
          const timer = setTimeout(() => resolve(null), timeoutMs);
          img.onload = () => {
            clearTimeout(timer);
            if (img.naturalWidth > 120 && img.naturalHeight > 120) {
              const isPng = /\.png(\?|#|$)/i.test(url) || /format=png/i.test(url);
              resolve({ src: url, isPng, w: img.naturalWidth, h: img.naturalHeight });
            } else {
              resolve(null);
            }
          };
          img.onerror = () => {
            clearTimeout(timer);
            resolve(null);
          };
          img.src = url;
        });
      },

      // Streams each API source progressively via onItemReady callback
      lastRun: {},

      // Source registry: domain drives weighting/toggles, cool = min ms between calls (rate-limit friendly)
      registry() {
        return [
          // history, archives, culture
          { id: 'otd', domain: 'HISTORY', fn: () => this.fromWikimediaOnThisDay() },
          { id: 'wellcome', domain: 'HISTORY', fn: () => this.fromWellcome() },
          { id: 'tfa', domain: 'ARCHIVE', fn: () => this.fromWikipediaFeatured() },
          { id: 'books', domain: 'BOOKS', fn: () => this.fromOpenLibrary() },
          { id: 'verse', domain: 'VERSE', fn: () => this.fromPoetry() },
          // art
          { id: 'potd', domain: 'ART', fn: () => this.fromWikimediaPictureOfDay() },
          { id: 'artic', domain: 'ART', fn: () => this.fromArtInstitute() },
          { id: 'met', domain: 'ART', fn: () => this.fromMetMuseum() },
          { id: 'cleveland', domain: 'ART', fn: () => this.fromClevelandArt() },
          // cosmos + earth science
          { id: 'nasa', domain: 'COSMOS', fn: () => this.fromNasaImageLibrary() },
          { id: 'apod', domain: 'COSMOS', cool: 8 * 60000, fn: () => this.fromApod() },
          { id: 'launch', domain: 'COSMOS', cool: 20 * 60000, fn: () => this.fromLaunches() },
          { id: 'iss', domain: 'COSMOS', cool: 12 * 60000, fn: () => this.fromISS() },
          { id: 'usgs', domain: 'EARTH', fn: () => this.fromUSGSEarthquakes() },
          { id: 'eonet', domain: 'EARTH', fn: () => this.fromEonet() },
          { id: 'kp', domain: 'EARTH', cool: 25 * 60000, fn: () => this.fromSpaceWeather() },
          // research
          { id: 'arxivai', domain: 'AI', fn: () => this.fromArxivAI() },
          { id: 'arxivsci', domain: 'SCIENCE', fn: () => this.fromArxivScience() },
          { id: 'arxivbiz', domain: 'BUSINESS', fn: () => this.fromArxivBusiness() },
          { id: 'nobel', domain: 'SCIENCE', fn: () => this.fromNobel() },
          { id: 'hfpapers', domain: 'AI', fn: () => this.fromHFPapers() },
          { id: 'hfmodels', domain: 'AI', cool: 4 * 60000, fn: () => this.fromHFModels() },
          { id: 'github', domain: 'AI', cool: 3 * 60000, fn: () => this.fromGitHubAI() },
          // tech + tech business
          { id: 'hnai', domain: 'AI', fn: () => this.fromHNSearch() },
          { id: 'hn', domain: 'TECH', fn: () => this.fromHackerNews() },
          { id: 'devto', domain: 'TECH', fn: () => this.fromDevTo() },
          // curated long-form publications
          ...this.RSS_FEEDS.map(f => ({ id: `rss-${f.id}`, domain: f.domain, cool: 2 * 60000, fn: () => this.fromRSS(f) }))
        ];
      },

      // Weighted random pick (no replacement): favours domains the reader enjoys, skips disabled + cooling sources
      pickFetchers(n) {
        const now = Date.now();
        const pool = this.registry().filter(f =>
          !Recommender.disabled.has(f.domain) && now - (this.lastRun[f.id] || 0) >= (f.cool || 0));
        const wOf = f => Recommender.weights[f.domain] || 1;
        const picked = [];
        while (picked.length < n && pool.length) {
          let r = Math.random() * pool.reduce((s, f) => s + wOf(f), 0);
          let idx = 0;
          for (; idx < pool.length - 1; idx++) { r -= wOf(pool[idx]); if (r <= 0) break; }
          picked.push(pool.splice(idx, 1)[0]);
        }
        return picked;
      },

      // Streams each API source progressively via onItemReady callback; resolves with number of reels produced
      async streamWave(onItemReady, n = 9) {
        let produced = 0;
        await Promise.allSettled(this.pickFetchers(n).map(async (f) => {
          this.lastRun[f.id] = Date.now();
          const reel = await f.fn();
          if (reel && reel.beats?.length && Quality.worthy(reel)) {
            produced++;
            if (onItemReady) onItemReady(reel);
          }
        }));
        return produced;
      },

      datePath(d) {
        return `${d.getUTCFullYear()}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${String(d.getUTCDate()).padStart(2, '0')}`;
      },

      // 2. Wikimedia "On This Day" Historical Milestone
      async fromWikimediaOnThisDay() {
        const now = new Date();
        const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(now.getUTCDate()).padStart(2, '0');
        const json = await this.getJSON(`https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/selected/${mm}/${dd}`);
        const events = (json?.selected || []).filter(ev => {
          const link = ev.pages?.[0]?.content_urls?.desktop?.page || '';
          const txt = Distiller.clean(ev.text);
          return txt && link && !SeenRegistry.has(link, `${ev.year}-${txt}`);
        });
        if (!events.length) return null;

        const pick = events[Math.floor(Math.random() * events.length)];
        const page = pick.pages?.[0];
        const sourceUrl = page?.content_urls?.desktop?.page || 'https://en.wikipedia.org';
        const story = Distiller.clean(pick.text);
        const verifiedPhoto = await this.verifyImage(page?.thumbnail?.source || page?.originalimage?.source);
        const beatsRaw = Distiller.buildDynamicBeats({
          kickerPrefix: `ON THIS DAY // ${pick.year}`,
          title: story,
          bodyText: page?.extract || '',
          hasPhoto: Boolean(verifiedPhoto)
        });
        SeenRegistry.mark(sourceUrl, `${pick.year}-${story}`);

        return this.composeReel({
          id: `otd-${pick.year}-${Math.random().toString(36).slice(2, 6)}`,
          domain: 'HISTORY',
          typo: 'typo-editorial',
          accent: '#eab308',
          sourceUrl,
          title: `${pick.year} — ${story}`,
          verifiedPhoto,
          beatsRaw
        });
      },

      // 3. Wikimedia Featured Picture of the Day
      async fromWikimediaPictureOfDay() {
        const d = new Date(Date.now() - Math.floor(Math.random() * 14) * 86400000);
        const yyyy = d.getUTCFullYear();
        const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(d.getUTCDate()).padStart(2, '0');
        const data = await this.getJSON(`https://api.wikimedia.org/feed/v1/wikipedia/en/featured/${yyyy}/${mm}/${dd}`);
        const imgObj = data?.image;
        if (!imgObj) return null;

        const title = Distiller.clean(imgObj.title?.replace(/^File:/i, '').replace(/\.[a-z]+$/i, '') || 'Archival Plate');
        const desc = Distiller.clean(imgObj.description?.text || '');
        const sourceUrl = imgObj.file_page || 'https://commons.wikimedia.org';
        if (SeenRegistry.has(sourceUrl, title)) return null;

        const verifiedPhoto = await this.verifyImage(imgObj.thumbnail?.source || imgObj.image?.source);
        if (!verifiedPhoto) return null;

        const beatsRaw = Distiller.buildDynamicBeats({
          kickerPrefix: 'FEATURED PLATE',
          title,
          bodyText: desc,
          hasPhoto: true
        });
        SeenRegistry.mark(sourceUrl, title);

        return this.composeReel({
          id: `potd-${yyyy}${mm}${dd}`,
          domain: 'ART',
          typo: 'typo-editorial',
          accent: '#f59e0b',
          sourceUrl,
          title,
          verifiedPhoto,
          beatsRaw
        });
      },

      // 4. NASA Image & Video Library
      async fromNasaImageLibrary() {
        const queries = ['nebula', 'galaxy', 'saturn', 'supernova', 'earth orbit', 'mars rover', 'eclipse'];
        const q = queries[Math.floor(Math.random() * queries.length)];
        const page = Math.floor(Math.random() * 6) + 1;
        const data = await this.getJSON(`https://images-api.nasa.gov/search?q=${encodeURIComponent(q)}&media_type=image&page=${page}`);
        const items = shuffle(data?.collection?.items || []);

        for (const item of items.slice(0, 8)) {
          const meta = item.data?.[0];
          const thumb = item.links?.find(l => l.rel === 'preview')?.href;
          if (!meta || !thumb) continue;
          const title = Distiller.clean(meta.title);
          const sourceUrl = `https://images.nasa.gov/details/${encodeURIComponent(meta.nasa_id)}`;
          if (SeenRegistry.has(sourceUrl, title)) continue;

          const verifiedPhoto = await this.verifyImage(thumb);
          if (!verifiedPhoto) continue;

          const beatsRaw = Distiller.buildDynamicBeats({
            kickerPrefix: 'NASA DEEP SPACE',
            title,
            bodyText: meta.description || '',
            hasPhoto: true
          });
          SeenRegistry.mark(sourceUrl, title);

          return this.composeReel({
            id: `nasa-${meta.nasa_id}`,
            domain: 'COSMOS',
            typo: 'typo-display',
            accent: '#38bdf8',
            sourceUrl,
            title,
            verifiedPhoto,
            beatsRaw
          });
        }
        return null;
      },

      // 5. arXiv Artificial Intelligence Preprints (cs.AI, cs.LG, cs.CL)
      async fromArxivAI() {

      // 10. Hacker News Engineering & Tech

            kickerPrefix: 'SYSTEMS & TECH',

            bodyText,
            hasPhoto: false

      // 21. NOAA planetary K-index (geomagnetic activity, last ~5 days)
      async fromSpaceWeather() {
        const j = await this.getJSON('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
        if (!Array.isArray(j) || j.length < 10) return null;
        const rows = Array.isArray(j[0]) ? j.slice(1) : j;
        const series = rows.map(r => parseFloat(Array.isArray(r) ? r[1] : (r.Kp ?? r.kp_index))).filter(Number.isFinite).slice(-40);
        if (series.length < 10) return null;
        const latest = series[series.length - 1];
        const peak = Math.max(...series);
        const level = latest >= 9 ? 'G5 extreme storm' : latest >= 8 ? 'G4 severe storm' : latest >= 7 ? 'G3 strong storm' : latest >= 6 ? 'G2 moderate storm' : latest >= 5 ? 'G1 minor storm' : latest >= 4 ? 'active' : 'quiet';
        const key = `kp-${new Date().getUTCDate()}-${Math.floor(new Date().getUTCHours() / 6)}`;
        if (SeenRegistry.has(key, key)) return null;
        SeenRegistry.mark(key, key);
        return this.composeReel({
          id: key,
          domain: 'EARTH', typo: 'typo-telemetry', accent: latest >= 5 ? '#f472b6' : '#2dd4bf',
          sourceUrl: 'https://www.swpc.noaa.gov/products/planetary-k-index',
          title: `Geomagnetic field is ${level} (Kp ${latest.toFixed(1)})`,
          verifiedPhoto: null,
          beatsRaw: [{
            kicker: 'SPACE WEATHER // NOAA SWPC',
            lines: [
              `Geomagnetic field is ${level}, with a planetary Kp index of ${latest.toFixed(1)}.`,
              `Over the past days the index peaked at ${peak.toFixed(1)}. At Kp 5 and above, auroras push far beyond the polar circles.`
            ],
            chartData: {
              symbol: 'PLANETARY Kp INDEX',
              priceFormatted: `Kp ${latest.toFixed(1)}`,
              deltaPct: 0,
              deltaText: level.toUpperCase(),
              color: latest >= 5 ? '#f472b6' : '#2dd4bf',
              series,
              rangeLabel: '3-HOUR STEPS'
            }
          }]
        });
      },
