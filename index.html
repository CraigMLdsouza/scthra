        const data = await this.getJSON(`https://api.github.com/search/repositories?q=topic:${topic}+created:%3E${since}&sort=stars&order=desc&per_page=15`);
        for (const r of shuffle(data?.items || [])) {
          const sourceUrl = safeUrl(r.html_url);
          const title = Distiller.clean(r.full_name);
          if (!sourceUrl || SeenRegistry.has(sourceUrl, title)) continue;
          const beatsRaw = Distiller.buildDynamicBeats({
            kickerPrefix: `OPEN SOURCE // ${topic.toUpperCase()}`,
            title,
            subtitle: `${Number(r.stargazers_count).toLocaleString()} stars in under a month.`,
            bodyText: `${r.description || ''} ${r.language ? 'Written mostly in ' + r.language + '.' : ''}`,
            hasPhoto: false
          });
          SeenRegistry.mark(sourceUrl, title);
          return this.composeReel({
            id: `gh-${r.id}`,
            domain: 'AI', typo: 'typo-display', accent: '#a5b4fc',
            sourceUrl, title, verifiedPhoto: null, beatsRaw
          });
        }
        return null;
      },

      // 32. Hacker News (Algolia) targeted searches: AI labs, chips, startups, funding
      async fromHNSearch() {
        const qs = [
          ['LLM', 'AI'], ['OpenAI', 'AI'], ['Anthropic Claude', 'AI'], ['AI agents', 'AI'], ['machine learning', 'AI'],
          ['Nvidia', 'BUSINESS'], ['startup funding', 'BUSINESS'], ['acquisition', 'BUSINESS'], ['semiconductor', 'BUSINESS'], ['cloud', 'TECH']
        ];
        const [q, domain] = qs[Math.floor(Math.random() * qs.length)];
        const data = await this.getJSON(`https://hn.algolia.com/api/v1/search_by_date?tags=story&query=${encodeURIComponent(q)}&numericFilters=${encodeURIComponent('points>100')}&hitsPerPage=20`);
        for (const h of shuffle(data?.hits || [])) {
          const title = Distiller.clean(h.title);
          const sourceUrl = safeUrl(h.url) || `https://news.ycombinator.com/item?id=${h.objectID}`;
          if (!title || SeenRegistry.has(sourceUrl, title)) continue;
          let host = 'Hacker News';
          try { host = new URL(sourceUrl).hostname.replace('www.', ''); } catch {}
          const beatsRaw = Distiller.buildDynamicBeats({
            kickerPrefix: `HN // ${q.toUpperCase()}`,
            title,
            bodyText: `From ${host}. It collected ${h.points || 0} points and ${h.num_comments || 0} comments on Hacker News.`,
            hasPhoto: false
          });
          SeenRegistry.mark(sourceUrl, title);
          return this.composeReel({
            id: `hnq-${h.objectID}`,
            domain, typo: 'typo-display', accent: domain === 'AI' ? '#a78bfa' : '#fbbf24',
            sourceUrl, title, verifiedPhoto: null, beatsRaw
          });
        }
        return null;
      },

      // 33. arXiv economics, finance and society preprints
      async fromArxivBusiness() {
        const cats = ['econ.GN', 'q-fin.GN', 'cs.CY', 'q-fin.CP', 'econ.TH'];
        const cat = cats[Math.floor(Math.random() * cats.length)];
        const start = Math.floor(Math.random() * 40);
        const xmlText = await this.getText(`https://export.arxiv.org/api/query?search_query=cat:${cat}&sortBy=submittedDate&sortOrder=descending&start=${start}&max_results=4`);
        if (!xmlText) return null;
        const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
        for (const entry of Array.from(doc.querySelectorAll('entry'))) {
          const title = Distiller.clean(entry.querySelector('title')?.textContent);
          const summary = Distiller.clean(entry.querySelector('summary')?.textContent);
          const sourceUrl = entry.querySelector('id')?.textContent?.trim();
          if (!title || !sourceUrl || SeenRegistry.has(sourceUrl, title)) continue;
          const beatsRaw = Distiller.buildDynamicBeats({
            kickerPrefix: `BUSINESS RESEARCH // ${cat.toUpperCase()}`,
            title, bodyText: summary, hasPhoto: false
          });
          SeenRegistry.mark(sourceUrl, title);
          return this.composeReel({
            id: `arxiv-biz-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
            domain: 'BUSINESS', typo: 'typo-editorial', accent: '#fbbf24',
            sourceUrl, title, verifiedPhoto: null, beatsRaw
          });
        }
        return null;
      },

      // 34. Wellcome Collection: history of medicine, science and ideas (open images)
      async fromWellcome() {
        const topics = ['anatomy', 'botany', 'astronomy', 'alchemy', 'manuscript', 'map', 'instrument', 'microscope', 'natural history', 'engraving'];
        const q = topics[Math.floor(Math.random() * topics.length)];
        const page = 1 + Math.floor(Math.random() * 6);
        const data = await this.getJSON(`https://api.wellcomecollection.org/catalogue/v2/images?query=${encodeURIComponent(q)}&pageSize=20&page=${page}`);
        for (const im of shuffle(data?.results || [])) {
          const wid = im.source?.id;
          const title = Distiller.clean(im.source?.title);
          const thumb = im.thumbnail?.url;
          if (!wid || !title || !thumb) continue;
          const sourceUrl = `https://wellcomecollection.org/works/${wid}`;
          if (SeenRegistry.has(sourceUrl, title)) continue;
          const verifiedPhoto = await this.verifyImage(thumb);
          if (!verifiedPhoto) continue;
          const work = await this.getJSON(`https://api.wellcomecollection.org/catalogue/v2/works/${wid}?include=contributors,production`);
          const who = (work?.contributors || []).map(c => c.agent?.label).filter(Boolean).slice(0, 2).join(' & ');
          const date = work?.production?.[0]?.dates?.[0]?.label;
          const body = `${Distiller.clean(work?.description || '')} ${date ? 'Dated ' + date + '.' : ''} ${work?.physicalDescription ? Distiller.clean(work.physicalDescription) + '.' : ''}`;
          const beatsRaw = Distiller.buildDynamicBeats({
            kickerPrefix: `WELLCOME COLLECTION // ${q.toUpperCase()}`,
            title,
            subtitle: who,
            bodyText: body,
            hasPhoto: true
          });
          SeenRegistry.mark(sourceUrl, title);
          return this.composeReel({
            id: `wellcome-${wid}`,
            domain: 'HISTORY', typo: 'typo-editorial', accent: '#fb7185',
            sourceUrl, title, verifiedPhoto, beatsRaw
          });
        }
        return null;
      },

      // 35. Nobel Prize laureates: who, when, and for what
      async fromNobel() {
        const offset = Math.floor(Math.random() * 950);
        const data = await this.getJSON(`https://api.nobelprize.org/2.1/laureates?offset=${offset}&limit=10`);
        for (const l of shuffle(data?.laureates || [])) {
          const name = Distiller.clean(l.knownName?.en || l.fullName?.en);
          const prize = l.nobelPrizes?.[0];
          if (!name || !prize?.motivation?.en) continue;
          const sourceUrl = safeUrl(l.wikipedia?.english) || 'https://www.nobelprize.org/prizes/';
          if (SeenRegistry.has(`nobel:${l.id}`, name)) continue;
          const cat = prize.category?.en || 'Science';
          const motive = Distiller.clean(prize.motivation.en).replace(/^["“]|["”]$/g, '');
          const born = l.birth?.date && !/^0000/.test(l.birth.date) ? `Born in ${String(l.birth.date).slice(0, 4)}${l.birth?.place?.locationString?.en ? ' in ' + Distiller.clean(l.birth.place.locationString.en) : ''}.` : '';
          const aff = prize.affiliations?.[0]?.name?.en ? `At the time of the award: ${Distiller.clean(prize.affiliations[0].name.en)}.` : '';
          const beatsRaw = Distiller.buildDynamicBeats({
            kickerPrefix: `NOBEL // ${cat.toUpperCase()} ${prize.awardYear}`,
            title: name,
            subtitle: `Awarded the ${prize.awardYear} Nobel Prize in ${cat} ${motive.replace(/\.$/, '')}.`,
            bodyText: `${born} ${aff}`,
            hasPhoto: false
          });
          SeenRegistry.mark(`nobel:${l.id}`, name);
          return this.composeReel({
            id: `nobel-${l.id}`,
            domain: 'SCIENCE', typo: 'typo-editorial', accent: '#fcd34d',
            sourceUrl, title: name, verifiedPhoto: null, beatsRaw
          });
        }
        return null;
      },

      composeReel({ id, domain, typo, accent, sourceUrl, title, verifiedPhoto, beatsRaw }) {
        const beats = beatsRaw
          .map(b => {
            const cleanLines = (b.lines || [])
              .map(l => Distiller.clean(l))
              .filter(Boolean);
            const hasPhoto = Boolean(b.attachPhoto && verifiedPhoto);
            const hasVisual = Boolean(hasPhoto || b.mapData || b.chartData || b.flightData || b.atmoData);
            return {
              kicker: b.kicker,
              lines: cleanLines.length ? cleanLines : [Distiller.clean(title)],
              hasPhoto,
              hasVisual,
              mapData: b.mapData || null,
              chartData: b.chartData || null,
              flightData: b.flightData || null,
              atmoData: b.atmoData || null,
              ms: Distiller.computeBeatDurationMs(cleanLines, hasVisual)
            };
          })
          .filter(b => b.lines.length > 0);

        return {
          id,
          domain,
          typo,
          accent,
          sourceUrl: safeUrl(sourceUrl),
          title,
          verifiedPhoto,
          beats
        };
      }
    };

    /* =========================================================================
       5B. GEOSPATIAL EARTHQUAKE MAP, MARKET CHART, FLIGHT RADAR & ATMOSPHERE
       ========================================================================= */
    const VisualBuilders = {
      mapMosaic(lat, lon) {
        const zoom = 4, n = 16;
        const la = Math.max(-85, Math.min(85, lat));
        const xF = ((lon + 180) / 360) * n;
        const r = (la * Math.PI) / 180;
        const yF = ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * n;
        const cx = Math.floor(xF), cy = Math.floor(yF);
        let tiles = '';
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const tx = (((cx + dx) % n) + n) % n;
            const ty = cy + dy;
            tiles += (ty < 0 || ty >= n)
              ? '<span></span>'
              : `<img src="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/${zoom}/${ty}/${tx}" alt="" onerror="this.style.opacity='0'" />`;
          }
        }
        const px = (1 + xF - cx) * 256, py = (1 + yF - cy) * 256;
        return `<div class="quake-mosaic" style="transform:translate(${(-px).toFixed(1)}px,${(-py).toFixed(1)}px)">${tiles}</div>`;
      },

      mapCaption(left, right, accent) {
        return `<div style="position:absolute;bottom:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;color:var(--ink-soft);background:rgba(5,5,7,0.78);padding:5px 9px;border-radius:4px;border:1px solid var(--hairline);"><span>${esc(left)}</span><span style="color:${accent};">${esc(right)}</span></div>`;
      },

      buildQuakeMapHTML(m, accent) {
        const { lat, lon, mag, depthKm } = m;
        const hasMag = Number.isFinite(mag);
        const ring = m.ring || (hasMag ? Math.round(Math.max(40, Math.min(140, 36 + (mag - 4) * 28))) : 60);
        const dur = m.dur || (hasMag ? Math.max(1.1, 3 - (mag - 4) * 0.6) : 2.4);
        const left = m.captionL || (hasMag ? `M ${mag.toFixed(1)} EPICENTER` : 'LOCATION');
        const right = m.captionR || (Number.isFinite(depthKm) ? `DEPTH ${depthKm.toFixed(1)} KM` : '');
        return `<div class="data-viz-card map-card"><div class="quake-map-wrap">${this.mapMosaic(lat, lon)}<div class="map-pin" style="--ring:${ring}px;--dur:${Number(dur).toFixed(2)}s"><b></b><i></i></div>${this.mapCaption(left, right, accent)}</div></div>`;
      },

      buildMarketChartHTML(chartData, accentIn) {
        const accent = chartData.color || (chartData.deltaPct >= 0 ? '#4ade80' : '#fb7185');
        const { symbol, priceFormatted, deltaPct, series, rangeLabel } = chartData;
        const min = Math.min(...series);
        const max = Math.max(...series);
        const span = max - min || 1;
        const w = 400;
        const h = 130;

        const pts = series.map((val, i) => {
          const x = (i / (series.length - 1)) * w;
          const y = h - 12 - ((val - min) / span) * (h - 24);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });

        const linePath = `M ${pts.join(' L ')}`;
        const areaPath = `${linePath} L ${w},${h} L 0,${h} Z`;
        const gradId = `grad_${Math.random().toString(36).slice(2, 8)}`;
        const sign = deltaPct >= 0 ? '+' : '';

        return `
          <div class="data-viz-card">
            <div class="market-card-inner">
              <div class="market-head">
                <div>
                  <div style="font-size:10px;letter-spacing:0.18em;color:var(--ink-dim);margin-bottom:4px;">${esc(symbol)}</div>
                  <div class="market-price">${priceFormatted}</div>
                </div>
                <div class="market-delta" style="color:${accent};">${chartData.deltaText ? esc(chartData.deltaText) : `${deltaPct >= 0 ? '▲' : '▼'} ${sign}${deltaPct.toFixed(2)}%`}</div>
              </div>
              <svg class="market-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="${accent}" stop-opacity="0.32" />
                    <stop offset="100%" stop-color="${accent}" stop-opacity="0.0" />
                  </linearGradient>
                </defs>
                <path d="${areaPath}" fill="url(#${gradId})" />
                <path d="${linePath}" fill="none" stroke="${accent}" stroke-width="2.2" />
              </svg>
              <div class="market-foot">
                <span>LOW ${min >= 1 ? min.toLocaleString(undefined, { maximumFractionDigits: 2 }) : min.toFixed(4)}</span>
                <span>${rangeLabel}</span>
                <span>HIGH ${max >= 1 ? max.toLocaleString(undefined, { maximumFractionDigits: 2 }) : max.toFixed(4)}</span>
              </div>
            </div>
          </div>
        `;
      },

      buildFlightMapHTML({ callsign, lat, lon, altMeters, speedKmh, heading }, accent) {
        const plane = `<svg viewBox="-6 -6 12 12" style="transform:rotate(${Number(heading) || 0}deg)"><polygon points="0,-5 3.4,4 0,2 -3.4,4"/></svg>`;
        return `<div class="data-viz-card map-card"><div class="quake-map-wrap">${this.mapMosaic(lat, lon)}<div class="map-pin"><b></b>${plane}</div>${this.mapCaption(`${callsign} • ${altMeters.toLocaleString()}M`, `${speedKmh} KM/H • HDG ${heading}°`, accent)}</div></div>`;
      },

      buildAtmosphereCardHTML(atmoData, accent) {
        const a = parseFloat(atmoData.aqi);
        const [aqiColor, aqiWord] = isNaN(a) ? [accent, ''] : a <= 20 ? ['#4ade80', 'GOOD'] : a <= 40 ? ['#a3e635', 'FAIR'] : a <= 60 ? ['#facc15', 'MODERATE'] : a <= 80 ? ['#fb923c', 'POOR'] : ['#f87171', 'VERY POOR'];
        return `
          <div class="data-viz-card">
            <div class="telemetry-card">
              <div style="display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-mono);">
                <div>
                  <div style="font-size:10px;letter-spacing:0.18em;color:var(--ink-dim);margin-bottom:4px;">ATMOSPHERE NODE</div>
                  <div style="font-size:clamp(22px,3.4vw,32px);color:var(--ink);">${atmoData.temp}</div>
                </div>
                <div style="font-size:11px;color:${aqiColor};letter-spacing:0.14em;">AQI ${atmoData.aqi} ${aqiWord}</div>
              </div>
              <div class="telemetry-grid">
                <div>
                  <div class="tele-cell-label">WIND</div>
                  <div class="tele-cell-val">${atmoData.wind}</div>
                </div>
                <div>
                  <div class="tele-cell-label">PRESSURE</div>
                  <div class="tele-cell-val">${atmoData.pressure}</div>
                </div>
                <div>
                  <div class="tele-cell-label">PM2.5 / UV</div>
                  <div class="tele-cell-val">${atmoData.pm25} • ${atmoData.uv}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    };

    /* =========================================================================
       6. ON-DEVICE MULTI-ARMED BANDIT RECOMMENDATION & EVOLUTION ENGINE
       ========================================================================= */
    const Recommender = {
      weights: {
        AI: 1.6,
        TECH: 1.4,
        SCIENCE: 1.4,
        BUSINESS: 1.1,
        COSMOS: 1.2,
        EARTH: 1.0,
        ART: 1.3,
        HISTORY: 1.3,
        CULTURE: 1.3,
        ARCHIVE: 1.0,
        BOOKS: 1.1,
        VERSE: 1.0
      },
      disabled: new Set(),
      likedSet: new Set(),
      savedReels: [],
      interactions: 0,

      rewardDomain(domain, delta) {
        if (this.weights[domain] !== undefined) {
          this.weights[domain] = Math.max(0.15, Math.min(3.2, this.weights[domain] + delta));
        }
        this.syncEvolutionUI();
      },

      rankBatch(reels) {
        return reels
          .map(r => ({
            reel: r,
            score: (this.weights[r.domain] || 1.0) + Math.random() * 0.65 + Quality.richness(r)
          }))
          .sort((a, b) => b.score - a.score)
          .map(x => x.reel);
      },

      syncEvolutionUI() {
        this.interactions++;
        let stage = '1';
        let roman = 'I';
        if (this.interactions >= 18) { stage = '4'; roman = 'IV'; }
        else if (this.interactions >= 10) { stage = '3'; roman = 'III'; }
        else if (this.interactions >= 4) { stage = '2'; roman = 'II'; }
        document.body.setAttribute('data-evo', stage);
        const evoLabel = document.getElementById('evo-label');
        if (evoLabel) evoLabel.textContent = roman;
        this.save();
      },

      renderDrawer() {
        const barsEl = document.getElementById('bandit-bars');
        const entries = Object.entries(this.weights).sort((a, b) => b[1] - a[1]);
        barsEl.innerHTML = entries.map(([dom, val]) => {
          const pct = Math.round((val / 3.2) * 100);
          return `
            <div class="bandit-row">
              <div class="bandit-meta"><span>${dom}</span><span>${val.toFixed(2)}</span></div>
              <div class="bandit-track"><div class="bandit-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('');

        const chipsEl = document.getElementById('source-chips');
        if (chipsEl) {
          chipsEl.innerHTML = Object.keys(this.weights).map(dom =>
            `<button type="button" class="hud-btn chip${this.disabled.has(dom) ? ' off' : ' active'}" data-domain="${dom}" aria-pressed="${!this.disabled.has(dom)}">${dom}</button>`
          ).join('');
        }

        const presetEl = document.getElementById('preset-chips');
        if (presetEl) {
          const all = Object.keys(this.weights);
          presetEl.innerHTML = Object.entries(this.PRESETS).map(([name, keep]) => {
            const want = keep ? all.filter(k => !keep.includes(k)) : [];
            const on = want.length === this.disabled.size && want.every(k => this.disabled.has(k));
            return `<button type="button" class="hud-btn chip${on ? ' active' : ''}" data-preset="${name}">${name}</button>`;
          }).join('');
        }

        const savedEl = document.getElementById('saved-list');
        if (!this.savedReels.length) {
          savedEl.innerHTML = `<div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);letter-spacing:0.14em;">DOUBLE-TAP ANY PIECE TO RESONATE</div>`;
          return;
        }
        savedEl.innerHTML = this.savedReels.map(r => `
          <div class="saved-card" tabindex="0" role="link" data-url="${esc(safeUrl(r.sourceUrl))}">
            <div style="font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:0.18em;margin-bottom:5px;">${r.domain} ↗</div>
            <div style="font-size:13px;line-height:1.4;color:var(--ink);">${esc(r.title)}</div>
          </div>
        `).join('');
      }
    };

    Recommender.PRESETS = {
      ALL: null,
      RESEARCH: ['AI', 'SCIENCE', 'COSMOS', 'EARTH', 'BUSINESS'],
      TECH: ['AI', 'TECH', 'BUSINESS'],
      CULTURE: ['ART', 'VERSE', 'BOOKS', 'CULTURE', 'HISTORY', 'ARCHIVE']
    };
    Recommender.KEY = 'SCTHRA_prefs_v1';
    Recommender.load = function () {
      try {
        const p = JSON.parse(localStorage.getItem(this.KEY) || '{}');
        for (const k in (p.weights || {})) {
          if (k in this.weights && Number.isFinite(p.weights[k])) this.weights[k] = Math.max(0.15, Math.min(3.2, p.weights[k]));
        }
        if (Array.isArray(p.saved)) {
          this.savedReels = p.saved.filter(r => r && r.id && safeUrl(r.sourceUrl));
          this.likedSet = new Set(this.savedReels.map(r => r.id));
        }
        if (Array.isArray(p.disabled)) this.disabled = new Set(p.disabled.filter(k => k in this.weights));
        this.interactions = Math.max(0, (p.interactions || 0) - 1);
        this.syncEvolutionUI();
      } catch {}
    };
    Recommender.save = function () {
      try {
        localStorage.setItem(this.KEY, JSON.stringify({
          weights: this.weights,
          interactions: this.interactions,
          disabled: [...this.disabled],
          saved: this.savedReels.slice(0, 50).map(r => ({ id: r.id, domain: r.domain, title: r.title, sourceUrl: r.sourceUrl }))
        }));
      } catch {}
    };

    /* =========================================================================
       7. STREAM CONTROLLER & STAGGERED LINE-BY-LINE RENDERING
       ========================================================================= */
    const State = {
      reels: [],
      activeReel: 0,
      activeBeat: 0,
      beatElapsed: 0,
      lineTimers: [],
      paused: false,
      fetching: false,
      userPaused: false
    };

    const streamEl = document.getElementById('stream');
    const sentinelEl = document.getElementById('buffer-sentinel');
    const progressEl = document.getElementById('top-progress');
    const edgeGlowEl = document.getElementById('source-edge-glow');
    const actionRailEl = document.getElementById('swipe-action-rail');
    const railOpenDomainEl = document.getElementById('rail-open-domain');
    const toastEl = document.getElementById('action-toast');

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2100);
    }

    function appendReel(reel) {
      if (!reel || State.reels.some(r => r.id === reel.id) || Recommender.disabled.has(reel.domain)) return;
      const idx = State.reels.length;
      State.reels.push(reel);

      const accentHex = reel.accent || '#e2b857';
      const section = document.createElement('section');
      section.className = 'reel';
      section.dataset.index = idx;
      section.style.setProperty('--accent', accentHex);
      section.style.setProperty('--reel-tint', hexToRgba(accentHex, 0.065));
      section.innerHTML = `<div class="stage ${reel.typo}"></div>`;

      streamEl.insertBefore(section, sentinelEl);

      if (idx === 0) {
        activateReel(0);
      }
    }

    function hexToRgba(hex, alpha) {
      const clean = String(hex || '#e2b857').replace('#', '');
      const full = clean.length === 3
        ? clean.split('').map(c => c + c).join('')
        : clean.padEnd(6, '0');
      const num = parseInt(full, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function syncThemeAccent(hex) {
      const accent = hex || '#e2b857';
      const root = document.documentElement.style;
      root.setProperty('--accent', accent);
      root.setProperty('--accent-soft', hexToRgba(accent, 0.16));
      root.setProperty('--accent-mid', hexToRgba(accent, 0.38));
      root.setProperty('--accent-glow', hexToRgba(accent, 0.28));
    }

    function clearLineTimers() {
      State.lineTimers.forEach(t => clearTimeout(t));
      State.lineTimers = [];
    }

    function activateReel(index) {
      if (index < 0 || index >= State.reels.length) return;
      State.activeReel = index;
      State.activeBeat = 0;
      State.beatElapsed = 0;

      const reel = State.reels[index];
      streamEl.querySelectorAll('.reel.is-active').forEach(el => el.classList.remove('is-active'));
      streamEl.querySelector(`.reel[data-index="${index}"]`)?.classList.add('is-active');
      syncThemeAccent(reel.accent);
      ContentAudio.tuneToReel(reel);
      syncLikeHUD();
      renderBeatWithStagger();

      if (index >= State.reels.length - 4) {
        harvestNextWave();
      }
    }

    function renderProgressSegs(count) {
      progressEl.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const seg = document.createElement('div');
        seg.className = 'prog-seg' + (i < State.activeBeat ? ' done' : '');
        seg.innerHTML = '<div class="prog-fill"></div>';
        progressEl.appendChild(seg);
      }
    }

    function renderBeatWithStagger() {
      clearLineTimers();
      const reel = State.reels[State.activeReel];
      const section = streamEl.querySelector(`.reel[data-index="${State.activeReel}"]`);
      if (!reel || !section) return;

      const beat = reel.beats[State.activeBeat];
      if (!beat) return;

      renderProgressSegs(reel.beats.length);
      const stage = section.querySelector('.stage');
      stage.style.transform = '';

      const showPhoto = Boolean(beat.hasPhoto && reel.verifiedPhoto);
      const showMap = Boolean(beat.mapData);
      const showChart = Boolean(beat.chartData);
      const showFlight = Boolean(beat.flightData);
      const showAtmo = Boolean(beat.atmoData);
      const hasVisualCard = showPhoto || showMap || showChart || showFlight || showAtmo;

      const linesHtml = beat.lines
        .map((line, i) => `<div class="reveal-line" data-line="${i}">${reel.typo === 'typo-verse' ? esc(line) : Distiller.highlightKeywords(line)}</div>`)
        .join('');

      let bodyHtml = `<div class="lines-stack">${linesHtml}</div>`;
      if (showPhoto) {
        const pngClass = reel.verifiedPhoto.isPng ? ' is-png' : '';
        const ar = (reel.verifiedPhoto.w || 1) / (reel.verifiedPhoto.h || 1);
        const shape = ar > 1.6 ? 'ph-wide' : ar < 0.85 ? 'ph-tall' : 'ph-even';
        bodyHtml = `
          <div class="visual-beat-wrap has-photo ${shape}">
            <div class="lines-stack">${linesHtml}</div>
            <div class="photo-frame${pngClass}">
              <img src="${esc(reel.verifiedPhoto.src)}" alt="" />
            </div>
          </div>
        `;
      } else if (showMap) {
        bodyHtml = `
          <div class="visual-beat-wrap has-photo">
            <div class="lines-stack">${linesHtml}</div>
            ${VisualBuilders.buildQuakeMapHTML(beat.mapData, reel.accent)}
          </div>
        `;
      } else if (showChart) {
        bodyHtml = `
          <div class="visual-beat-wrap has-photo">
            <div class="lines-stack">${linesHtml}</div>
            ${VisualBuilders.buildMarketChartHTML(beat.chartData, reel.accent)}
          </div>
        `;
      } else if (showFlight) {
        bodyHtml = `
          <div class="visual-beat-wrap has-photo">
            <div class="lines-stack">${linesHtml}</div>
            ${VisualBuilders.buildFlightMapHTML(beat.flightData, reel.accent)}
          </div>
        `;
      } else if (showAtmo) {
        bodyHtml = `
          <div class="visual-beat-wrap has-photo">
            <div class="lines-stack">${linesHtml}</div>
            ${VisualBuilders.buildAtmosphereCardHTML(beat.atmoData, reel.accent)}
          </div>
        `;
      }

      const counterHtml = reel.beats.length > 1
        ? `<span>${String(State.activeBeat + 1).padStart(2, '0')} / ${String(reel.beats.length).padStart(2, '0')}</span>`
        : '';

      let host = '';
      try { host = new URL(reel.sourceUrl).hostname.replace('www.', ''); } catch {}
      const lastBeat = State.activeBeat === reel.beats.length - 1;
      const footHtml = host
        ? `<div class="stage-foot"><span>${esc(host)}</span><span>${lastBeat ? 'SWIPE → OPEN' : ''}</span></div>`
        : '';

      stage.innerHTML = `
        <div class="stage-kicker">
          <span>${esc(beat.kicker)}</span>
          ${counterHtml}
        </div>
        ${bodyHtml}
        ${footHtml}
      `;

      const leadLen = (beat.lines[0] || '').length;
      const leadScale = leadLen < 30 ? 1.35 : leadLen < 60 ? 1.15 : leadLen < 110 ? 1 : leadLen < 170 ? 0.88 : 0.76;
      stage.style.setProperty('--lead-scale', (leadScale * (hasVisualCard ? 0.92 : 1)).toFixed(2));
      fitStageToViewport(stage, hasVisualCard);
      stage.querySelector('.photo-frame img')?.addEventListener('load', () => fitStageToViewport(stage, hasVisualCard), { once: true });

      const visualEl = stage.querySelector('.photo-frame, .data-viz-card');
      if (visualEl) {
        requestAnimationFrame(() => visualEl.classList.add('shown'));
      }

      const lineEls = Array.from(stage.querySelectorAll('.reveal-line'));
      lineEls.forEach((el, idx) => {
        const timer = setTimeout(() => {
          el.classList.add('shown');
          ContentAudio.playLineNote(reel, beat.lines[idx], idx);
        }, idx * 460);
        State.lineTimers.push(timer);
      });
    }

    function stepBeat(delta) {
      const reel = State.reels[State.activeReel];
      if (!reel) return;
      const next = State.activeBeat + delta;
      if (next < 0) {
        State.activeBeat = 0;
        State.beatElapsed = 0;
        renderBeatWithStagger();
      } else if (next >= reel.beats.length) {
        const nextReel = State.activeReel + 1;
        if (nextReel < State.reels.length) {
          ContentAudio.playTransitionPulse(1);
          streamEl.querySelector(`.reel[data-index="${nextReel}"]`)?.scrollIntoView({ behavior: 'smooth' });
        } else {
          State.activeBeat = 0;
          State.beatElapsed = 0;
          renderBeatWithStagger();
        }
      } else {
        ContentAudio.playTransitionPulse(delta);
        State.activeBeat = next;
        State.beatElapsed = 0;
        renderBeatWithStagger();
      }
    }

    function openSourceForActiveReel() {
      const reel = State.reels[State.activeReel];
      if (!reel?.sourceUrl) return;
      Recommender.rewardDomain(reel.domain, 0.35);
      window.open(reel.sourceUrl, '_blank', 'noopener,noreferrer');
    }

    // Shares the original source URL (not the generated card). navigator.share must run
    // synchronously inside the user gesture on iOS, so no awaits before this call.
    function shareSourceLink() {
      const reel = State.reels[State.activeReel];
      const url = reel?.sourceUrl;
      if (!url) return;
      Recommender.rewardDomain(reel.domain, 0.3);
      if (navigator.share) {
        navigator.share({ title: reel.title, url }).catch((err) => {
          if (err?.name !== 'AbortError') copyTextFallback(url);
        });
      } else {
        copyTextFallback(url);
      }
    }

    async function copyTextFallback(text) {
      try { await navigator.clipboard.writeText(text); showToast('SOURCE LINK COPIED'); return; } catch {}
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        showToast('SOURCE LINK COPIED');
      } catch {
        showToast('COPY FAILED');
      }
      ta.remove();
    }

    /* =========================================================================
       7B. SHARE CARD PNG GENERATOR (RENDERS ACTIVE SLIDE TO 1080x1350 PNG)
       ========================================================================= */
    const ShareCardBuilder = {
      lastDataUrl: null,
      lastBlob: null,
      lastFilename: 'SCTHRA-card.png',

      loadCorsImage(url, timeoutMs = 2400) {
        return new Promise((resolve) => {
          if (!url) return resolve(null);
          const img = new Image();
          img.crossOrigin = 'anonymous';
          const timer = setTimeout(() => resolve(null), timeoutMs);
          img.onload = () => {
            clearTimeout(timer);
            resolve(img.naturalWidth > 0 ? img : null);
          };
          img.onerror = () => {
            clearTimeout(timer);
            resolve(null);
          };
          img.src = url;
        });
      },

      wrapText(ctx, text, maxWidth) {
        const words = String(text || '').split(/\s+/);
        const lines = [];
        let current = '';
        for (const word of words) {
          const test = current ? `${current} ${word}` : word;
          if (ctx.measureText(test).width > maxWidth && current) {
            lines.push(current);
            current = word;
          } else {
            current = test;
          }
        }
        if (current) lines.push(current);
        return lines;
      },

      async renderSlideToPNG(reel, beatIndex) {
        const beat = reel.beats[beatIndex] || reel.beats[0];
        try { await Promise.all(['500 22px "JetBrains Mono"', '400 52px "Instrument Serif"', '400 32px "Space Grotesk"'].map(f => document.fonts.load(f))); } catch {}
        const W = 1080;
        const H = 1350;
        const pad = 76;
        const accent = reel.accent || '#e2b857';

        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');

        // Background Gradient
        const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.35, 60, W * 0.5, H * 0.5, H * 0.85);
        bgGrad.addColorStop(0, '#12131a');
        bgGrad.addColorStop(1, '#050507');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Editorial Border & Corner Brackets
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 2;
        ctx.strokeRect(36, 36, W - 72, H - 72);

        const bLen = 36;
        ctx.strokeStyle = accent;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(36, 36 + bLen); ctx.lineTo(36, 36); ctx.lineTo(36 + bLen, 36);
        ctx.moveTo(W - 36 - bLen, 36); ctx.lineTo(W - 36, 36); ctx.lineTo(W - 36, 36 + bLen);
        ctx.moveTo(36, H - 36 - bLen); ctx.lineTo(36, H - 36); ctx.lineTo(36 + bLen, H - 36);
        ctx.moveTo(W - 36 - bLen, H - 36); ctx.lineTo(W - 36, H - 36); ctx.lineTo(W - 36, H - 36 - bLen);
        ctx.stroke();

        // Top Header: SCTHRA & Slide Counter
        ctx.fillStyle = '#f3f2ee';
        ctx.font = '500 22px "JetBrains Mono", monospace';
        ctx.fillText('SCTHRA', pad, 108);

        ctx.fillStyle = accent;
        ctx.font = '500 20px "JetBrains Mono", monospace';
        const slideTag = reel.beats.length > 1
          ? `${String(beatIndex + 1).padStart(2, '0')} / ${String(reel.beats.length).padStart(2, '0')}`
          : reel.domain;
        const tagW = ctx.measureText(slideTag).width;
        ctx.fillText(slideTag, W - pad - tagW, 108);

        // Kicker
        let cursorY = 186;
        ctx.fillStyle = accent;
        ctx.font = '500 21px "JetBrains Mono", monospace';
        ctx.fillText((beat.kicker || reel.domain).toUpperCase(), pad, cursorY);
        cursorY += 54;

        // Optional CORS-Safe Photo or Data Visualization
        let corsImg = null;
        if (beat.hasPhoto && reel.verifiedPhoto?.src) {
          corsImg = await this.loadCorsImage(reel.verifiedPhoto.src);
        }

        const innerW = W - pad * 2;
        const maxBottomY = H - 150;

        if (corsImg) {
          const boxH = 430;
          ctx.fillStyle = reel.verifiedPhoto.isPng ? '#ffffff' : '#0c0d12';
          ctx.fillRect(pad, cursorY, innerW, boxH);
          ctx.strokeStyle = 'rgba(255,255,255,0.14)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(pad, cursorY, innerW, boxH);

          const scale = Math.min((innerW - 24) / corsImg.naturalWidth, (boxH - 24) / corsImg.naturalHeight);
          const dw = corsImg.naturalWidth * scale;
          const dh = corsImg.naturalHeight * scale;
          ctx.drawImage(corsImg, pad + (innerW - dw) / 2, cursorY + (boxH - dh) / 2, dw, dh);
          cursorY += boxH + 48;
        } else if (beat.chartData) {
          const boxH = 290;
          ctx.fillStyle = 'rgba(15, 16, 22, 0.92)';
          ctx.fillRect(pad, cursorY, innerW, boxH);
          ctx.strokeStyle = 'rgba(255,255,255,0.14)';
          ctx.strokeRect(pad, cursorY, innerW, boxH);

          const { symbol, priceFormatted, deltaPct, series } = beat.chartData;
          ctx.fillStyle = 'rgba(243,242,238,0.5)';
          ctx.font = '500 18px "JetBrains Mono", monospace';
          ctx.fillText(symbol, pad + 28, cursorY + 42);

          ctx.fillStyle = '#f3f2ee';
          ctx.font = '600 36px "JetBrains Mono", monospace';
          ctx.fillText(priceFormatted, pad + 28, cursorY + 86);

          const sign = deltaPct >= 0 ? '+' : '';
          const deltaTxt = beat.chartData.deltaText || `${sign}${deltaPct.toFixed(2)}%`;
          ctx.fillStyle = accent;
          ctx.font = '500 22px "JetBrains Mono", monospace';
          ctx.fillText(deltaTxt, W - pad - 28 - ctx.measureText(deltaTxt).width, cursorY + 84);

          const min = Math.min(...series);
          const max = Math.max(...series);
          const span = max - min || 1;
          const gx = pad + 28;
          const gy = cursorY + 115;
          const gw = innerW - 56;
          const gh = 140;

          ctx.beginPath();
          series.forEach((v, i) => {
            const x = gx + (i / (series.length - 1)) * gw;
            const y = gy + gh - ((v - min) / span) * gh;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.strokeStyle = accent;
          ctx.lineWidth = 4;
          ctx.stroke();
          cursorY += boxH + 46;
        } else if (beat.mapData || beat.flightData || beat.atmoData) {
          const boxH = 170;
          ctx.fillStyle = 'rgba(15, 16, 22, 0.92)';
          ctx.fillRect(pad, cursorY, innerW, boxH);
          ctx.strokeStyle = 'rgba(255,255,255,0.14)';
          ctx.strokeRect(pad, cursorY, innerW, boxH);

          ctx.fillStyle = accent;
          ctx.font = '500 20px "JetBrains Mono", monospace';
          if (beat.mapData) {
            const mp = beat.mapData;
            const quake = Number.isFinite(mp.mag);
            ctx.fillText(quake ? `M ${mp.mag.toFixed(1)} SEISMIC EPICENTER` : String(mp.captionL || 'LOCATION'), pad + 28, cursorY + 56);
            ctx.fillStyle = '#f3f2ee';
            ctx.fillText(`LAT ${mp.lat.toFixed(3)}°  ·  LON ${mp.lon.toFixed(3)}°` + (Number.isFinite(mp.depthKm) ? `  ·  DEPTH ${mp.depthKm.toFixed(1)} KM` : (mp.captionR ? `  ·  ${mp.captionR}` : '')), pad + 28, cursorY + 112);
          } else if (beat.flightData) {
            ctx.fillText(`TRANSPONDER ${beat.flightData.callsign}  ·  HDG ${beat.flightData.heading}°`, pad + 28, cursorY + 56);
            ctx.fillStyle = '#f3f2ee';
            ctx.fillText(`ALT ${beat.flightData.altMeters.toLocaleString()} M  ·  VEL ${beat.flightData.speedKmh} KM/H`, pad + 28, cursorY + 112);
          } else if (beat.atmoData) {
            ctx.fillText(`${beat.atmoData.city.toUpperCase()} BIOSPHERE  ·  AQI ${beat.atmoData.aqi}`, pad + 28, cursorY + 56);
            ctx.fillStyle = '#f3f2ee';
            ctx.fillText(`${beat.atmoData.temp}  ·  WIND ${beat.atmoData.wind}  ·  ${beat.atmoData.pressure}`, pad + 28, cursorY + 112);
          }
          cursorY += boxH + 46;
        }

        // Dynamic Typography Fit for Slide Lines
        let scaleFactor = 1.0;
        const lines = beat.lines || [reel.title];

        const measureTotalHeight = (sf) => {
          let total = 0;
          lines.forEach((line, idx) => {
            const isLead = idx === 0;
            const fontSize = Math.round((isLead ? 52 : 32) * sf);
            const lineHeight = Math.round(fontSize * 1.28);
            ctx.font = isLead
              ? `400 ${fontSize}px "Instrument Serif", Georgia, serif`
              : `400 ${fontSize}px "Space Grotesk", sans-serif`;
            const wrapped = this.wrapText(ctx, line, innerW);
            total += wrapped.length * lineHeight + Math.round(24 * sf);
          });
          return total;
        };

        while (cursorY + measureTotalHeight(scaleFactor) > maxBottomY && scaleFactor > 0.52) {
          scaleFactor -= 0.04;
        }

        lines.forEach((line, idx) => {
          const isLead = idx === 0;
          const fontSize = Math.round((isLead ? 52 : 32) * scaleFactor);
          const lineHeight = Math.round(fontSize * 1.28);
          ctx.font = isLead
            ? `400 ${fontSize}px "Instrument Serif", Georgia, serif`
            : `400 ${fontSize}px "Space Grotesk", sans-serif`;
          ctx.fillStyle = isLead ? '#f3f2ee' : 'rgba(243, 242, 238, 0.82)';

          const wrapped = this.wrapText(ctx, line, innerW);
          for (const wLine of wrapped) {
            if (cursorY + lineHeight > maxBottomY) break;
            ctx.fillText(wLine, pad, cursorY + fontSize * 0.85);
            cursorY += lineHeight;
          }
          cursorY += Math.round(24 * scaleFactor);
        });

        // Bottom Attribution Bar
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pad, H - 114);
        ctx.lineTo(W - pad, H - 114);
        ctx.stroke();

        let host = 'LIVE ARCHIVE';
        try {
          host = new URL(reel.sourceUrl).hostname.replace('www.', '').toUpperCase();
        } catch {}

        ctx.fillStyle = 'rgba(243, 242, 238, 0.5)';
        ctx.font = '500 18px "JetBrains Mono", monospace';
        ctx.fillText(`SOURCE // ${host}`, pad, H - 72);

        const sig = new Date().toISOString().slice(0, 10);
        const sigW = ctx.measureText(sig).width;
        ctx.fillText(sig, W - pad - sigW, H - 72);

        const dataUrl = canvas.toDataURL('image/png');
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        const slug = (reel.domain || 'card').toLowerCase();
        this.lastDataUrl = dataUrl;
        this.lastBlob = blob;
        this.lastFilename = `SCTHRA-${slug}-${Date.now().toString(36)}.png`;
        return dataUrl;
      }
    };

    const shareModal = document.getElementById('share-modal');
    const sharePreviewImg = document.getElementById('share-card-preview');

    async function openShareCardModal() {
      const reel = State.reels[State.activeReel];
      if (!reel) return;
      Recommender.rewardDomain(reel.domain, 0.3);
      const dataUrl = await ShareCardBuilder.renderSlideToPNG(reel, State.activeBeat);
      sharePreviewImg.src = dataUrl;
      shareModal.classList.add('open');
      document.getElementById('btn-download-png').focus();
    }

    function closeShareCardModal() {
      shareModal.classList.remove('open');
    }

    function downloadShareCardPNG() {
      if (!ShareCardBuilder.lastDataUrl) return;
      const a = document.createElement('a');
      a.href = ShareCardBuilder.lastDataUrl;
      a.download = ShareCardBuilder.lastFilename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('PNG CARD DOWNLOADED');
    }

    async function triggerNativeOrCopyShare() {
      const reel = State.reels[State.activeReel];
      if (!reel) return;
      if (navigator.share && ShareCardBuilder.lastBlob) {
        try {
          const file = new File([ShareCardBuilder.lastBlob], ShareCardBuilder.lastFilename, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title: reel.title, url: reel.sourceUrl, files: [file] });
            return;
          }
          await navigator.share({ title: reel.title, url: reel.sourceUrl });
          return;
        } catch {}
      }
      downloadShareCardPNG();
    }

    function dismissDomainAndAdvance() {
      const reel = State.reels[State.activeReel];
      if (!reel) return;
      const mutedDomain = reel.domain;
      Recommender.rewardDomain(mutedDomain, -0.65);

      for (let i = State.reels.length - 1; i > State.activeReel; i--) {
        if (State.reels[i].domain === mutedDomain && !Recommender.likedSet.has(State.reels[i].id)) {
          State.reels.splice(i, 1);
          const el = streamEl.querySelector(`.reel[data-index="${i}"]`);
          if (el) el.remove();
        }
      }
      Array.from(streamEl.querySelectorAll('.reel')).forEach((el, idx) => {
        el.dataset.index = idx;
      });

      showToast(`LESS FROM ${mutedDomain}`);
      const nextReel = State.activeReel + 1;
      if (nextReel < State.reels.length) {
        streamEl.querySelector(`.reel[data-index="${nextReel}"]`)?.scrollIntoView({ behavior: 'smooth' });
      } else {
        harvestNextWave().then(() => {
          const target = streamEl.querySelector(`.reel[data-index="${State.activeReel + 1}"]`);
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        });
      }
    }

    function pruneDomainAhead(domain) {
      for (let i = State.reels.length - 1; i > State.activeReel; i--) {
        if (State.reels[i].domain === domain && !Recommender.likedSet.has(State.reels[i].id)) {
          State.reels.splice(i, 1);
          streamEl.querySelector(`.reel[data-index="${i}"]`)?.remove();
        }
      }
      Array.from(streamEl.querySelectorAll('.reel')).forEach((el, idx) => { el.dataset.index = idx; });
    }

    function toggleResonance(x, y) {
      const ring = document.createElement('div');
      ring.className = 'resonance-pulse';
      ring.style.left = (x || window.innerWidth / 2) + 'px';
      ring.style.top = (y || window.innerHeight / 2) + 'px';
      document.body.appendChild(ring);
      setTimeout(() => ring.remove(), 700);

      const reel = State.reels[State.activeReel];
      if (!reel) return;

      if (Recommender.likedSet.has(reel.id)) {
        Recommender.likedSet.delete(reel.id);
        Recommender.savedReels = Recommender.savedReels.filter(r => r.id !== reel.id);
        Recommender.save();
      } else {
        Recommender.likedSet.add(reel.id);
        Recommender.savedReels.unshift(reel);
        Recommender.rewardDomain(reel.domain, 0.35);
      }
      syncLikeHUD();
    }

    function syncLikeHUD() {
      const reel = State.reels[State.activeReel];
      const liked = reel && Recommender.likedSet.has(reel.id);
      const btn = document.getElementById('btn-like');
      const heart = document.getElementById('like-heart');
      btn.classList.toggle('liked', Boolean(liked));
      heart.textContent = liked ? '♥' : '♡';
    }

    /* =========================================================================
       8. GESTURES: HOLD-TO-PAUSE (RESUMES ON RELEASE) + 3-WAY SWIPE-RIGHT RAIL
       ========================================================================= */
    let downAt = 0;
    let downX = 0;
    let downY = 0;
    let holdTimer = null;
    let lastTapAt = 0;
    let tapTimer = null;
    let pullingSource = false;
    let swipeMode = 'open';

    function releaseHoldPause() {
      clearTimeout(holdTimer);
      holdTimer = null;
      if (State.paused) {
        State.paused = false;
        document.body.classList.remove('reading-paused');
      }
    }

    function resetSourcePull(animate = true) {
      pullingSource = false;
      swipeMode = 'open';
      edgeGlowEl.style.opacity = '0';
      actionRailEl.classList.remove('visible');
      actionRailEl.style.transform = 'translateY(-50%) translateX(-130%)';
      const activeSection = streamEl.querySelector(`.reel[data-index="${State.activeReel}"]`);
      const stage = activeSection?.querySelector('.stage');
      if (stage) {
        stage.style.transition = animate ? 'transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
        stage.style.transform = 'translate3d(0, 0, 0) scale(1)';
      }
    }

    streamEl.addEventListener('pointerdown', (e) => {
      ContentAudio.unlock();
      if (e.target.closest('button')) return;

      downAt = performance.now();
      downX = e.clientX;
      downY = e.clientY;
      pullingSource = false;
      swipeMode = 'open';

      holdTimer = setTimeout(() => {
        State.paused = true;
        document.body.classList.add('reading-paused');
      }, 170);
    });

    // iOS Safari: once a horizontal pull has begun, stop the browser from claiming the touch for scrolling
    streamEl.addEventListener('touchmove', (e) => { if (pullingSource) e.preventDefault(); }, { passive: false });
    // iOS only unlocks Web Audio on touchend/click, not pointerdown
    ['touchend', 'click'].forEach(t => window.addEventListener(t, () => ContentAudio.unlock(), { passive: true }));

    streamEl.addEventListener('pointermove', (e) => {
      if (!downAt) return;
      const dx = e.clientX - downX;
      const dy = e.clientY - downY;

      if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
        releaseHoldPause();
      }

      const reel = State.reels[State.activeReel];
      const onLastBeat = reel && State.activeBeat === reel.beats.length - 1;

      if (pullingSource || (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy) * 1.1 && (dx > 0 || onLastBeat))) {
        pullingSource = true;
        const absDx = Math.abs(dx);
        const progress = Math.min(1, absDx / 105);
        const dampedX = Math.pow(absDx, 0.78) * 2.2;

        // Vertical branching while holding right: Up = Share, Center = Open, Down = Not Interested
        let nextMode = 'open';
        if (dy < -42) nextMode = 'share';
        else if (dy > 42) nextMode = 'mute';
        swipeMode = nextMode;

        try {
          railOpenDomainEl.textContent = 'OPEN ' + new URL(reel.sourceUrl).hostname.replace('www.', '').toUpperCase();
        } catch {
          railOpenDomainEl.textContent = 'OPEN SOURCE';
        }

        edgeGlowEl.style.opacity = String(progress);
        actionRailEl.classList.add('visible');
        actionRailEl.style.transform = `translateY(-50%) translateX(${((progress - 1) * 115).toFixed(1)}%)`;

        actionRailEl.querySelectorAll('.rail-node').forEach(node => {
          node.classList.toggle('selected', node.dataset.mode === swipeMode);
        });

        const activeSection = streamEl.querySelector(`.reel[data-index="${State.activeReel}"]`);
        const stage = activeSection?.querySelector('.stage');
        if (stage) {
          const dir = dx >= 0 ? 1 : -1;
          const nudgeY = swipeMode === 'share' ? -14 : swipeMode === 'mute' ? 14 : 0;
          stage.style.transition = 'none';
          stage.style.transform = `translate3d(${(dir * dampedX * 0.55).toFixed(1)}px, ${nudgeY}px, 0) scale(${(1 - progress * 0.025).toFixed(4)})`;
        }
      }
    });

    streamEl.addEventListener('pointerup', (e) => {
      const wasPaused = State.paused;
      releaseHoldPause();

      if (!downAt) return;
      const dx = e.clientX - downX;
      const dy = e.clientY - downY;
      const dt = performance.now() - downAt;
      downAt = 0;

      const reel = State.reels[State.activeReel];
      const onLastBeat = reel && State.activeBeat === reel.beats.length - 1;

      if (pullingSource) {
        const triggered = dx > 86 || (onLastBeat && dx < -86);
        const chosenMode = swipeMode;
        resetSourcePull(true);
        if (triggered) {
          if (chosenMode === 'mute') dismissDomainAndAdvance();
          else if (chosenMode === 'share') shareSourceLink();
          else openSourceForActiveReel();
        }
        return;
      }

      if (wasPaused || dt > 260 || Math.abs(dx) > 16 || Math.abs(dy) > 16) {
        return;
      }

      const now = performance.now();
      if (tapTimer && now - lastTapAt < 260) {
        clearTimeout(tapTimer);
        tapTimer = null;
        lastTapAt = 0;
        toggleResonance(e.clientX, e.clientY);
        return;
      }
      lastTapAt = now;
      const back = e.clientX < window.innerWidth * 0.3;
      tapTimer = setTimeout(() => { tapTimer = null; stepBeat(back ? -1 : 1); }, 220);
    });

    window.addEventListener('pointercancel', () => {
      downAt = 0;
      releaseHoldPause();
      resetSourcePull(true);
    });
    window.addEventListener('blur', () => {
      downAt = 0;
      releaseHoldPause();
      resetSourcePull(true);
    });
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Vertical Scroll-Snap Detection
    let scrollTimer = null;
    streamEl.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const idx = Math.round(streamEl.scrollTop / streamEl.clientHeight);
        if (idx !== State.activeReel && idx >= 0 && idx < State.reels.length) {
          const prev = State.reels[State.activeReel];
          if (prev && State.activeBeat >= 1) {
            Recommender.rewardDomain(prev.domain, 0.12);
          }
          activateReel(idx);
        }
      }, 60);
    });

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {
      ContentAudio.unlock();
      if (e.key === 'ArrowRight') {
        const reel = State.reels[State.activeReel];
        if (reel && State.activeBeat === reel.beats.length - 1) {
          openSourceForActiveReel();
        } else {
          stepBeat(1);
        }
      } else if (e.key === 'ArrowLeft') {
        stepBeat(-1);
      } else if (e.key === 'ArrowDown') {
        const next = Math.min(State.reels.length - 1, State.activeReel + 1);
        streamEl.querySelector(`.reel[data-index="${next}"]`)?.scrollIntoView({ behavior: 'smooth' });
      } else if (e.key === 'ArrowUp') {
        const prev = Math.max(0, State.activeReel - 1);
        streamEl.querySelector(`.reel[data-index="${prev}"]`)?.scrollIntoView({ behavior: 'smooth' });
      } else if (e.key.toLowerCase() === 'm') {
        ContentAudio.toggle();
      } else if (e.key.toLowerCase() === 'l') {
        toggleResonance();
      } else if (e.key.toLowerCase() === 's') {
        openShareCardModal();
      } else if (e.key === ' ' && !e.target.closest('button, .saved-card')) {
        e.preventDefault();
        State.userPaused = !State.userPaused;
        document.body.classList.toggle('reading-paused', State.userPaused);
        showToast(State.userPaused ? 'PAUSED' : 'PLAYING');
      } else if (e.key === 'Escape') {
        closeDrawer();
        closeShareCardModal();
      }
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
      const section = streamEl.querySelector(`.reel[data-index="${State.activeReel}"]`);
      const reel = State.reels[State.activeReel];
      if (section && reel) {
        const beat = reel.beats[State.activeBeat];
        const hasVisual = Boolean((beat?.hasPhoto && reel.verifiedPhoto) || beat?.mapData || beat?.chartData || beat?.flightData || beat?.atmoData);
        fitStageToViewport(section.querySelector('.stage'), hasVisual);
      }
      }, 120);
    });

    // HUD & Affinity Drawer Wiring
    const drawer = document.getElementById('affinity-drawer');
    const overlay = document.getElementById('drawer-overlay');

    function openDrawer() {
      Recommender.renderDrawer();
      overlay.classList.add('open');
      drawer.classList.add('open');
    }

    function closeDrawer() {
      overlay.classList.remove('open');
      drawer.classList.remove('open');
    }

    document.getElementById('btn-sound').addEventListener('click', (e) => {
      e.stopPropagation();
      ContentAudio.toggle();
    });

    document.getElementById('btn-share-card').addEventListener('click', (e) => {
      e.stopPropagation();
      openShareCardModal();
    });

    document.getElementById('btn-download-png').addEventListener('click', downloadShareCardPNG);
    document.getElementById('btn-native-share').addEventListener('click', triggerNativeOrCopyShare);
    document.getElementById('btn-copy-source').addEventListener('click', () => {
      const reel = State.reels[State.activeReel];
      if (!reel?.sourceUrl) return;
      copyTextFallback(reel.sourceUrl);
    });
    document.getElementById('btn-close-share').addEventListener('click', closeShareCardModal);
    shareModal.addEventListener('click', (e) => {
      if (e.target === shareModal) closeShareCardModal();
    });

    document.getElementById('btn-like').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleResonance(window.innerWidth - 78, 28);
    });

    document.getElementById('btn-affinity').addEventListener('click', (e) => {
      e.stopPropagation();
      openDrawer();
    });

    document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
    document.getElementById('preset-chips').addEventListener('click', (e) => {
      const b = e.target.closest('[data-preset]');
      if (!b) return;
      const keep = Recommender.PRESETS[b.dataset.preset];
      Recommender.disabled = new Set(keep ? Object.keys(Recommender.weights).filter(k => !keep.includes(k)) : []);
      Recommender.disabled.forEach(d => pruneDomainAhead(d));
      Recommender.save();
      Recommender.renderDrawer();
      showToast(`FOCUS: ${b.dataset.preset}`);
      if (State.reels.length - State.activeReel <= 4) harvestNextWave();
    });
    const goReel = (d) => {
      const n = Math.max(0, Math.min(State.reels.length - 1, State.activeReel + d));
      streamEl.querySelector(`.reel[data-index="${n}"]`)?.scrollIntoView({ behavior: 'smooth' });
    };
    document.getElementById('nav-up').addEventListener('click', () => goReel(-1));
    document.getElementById('nav-down').addEventListener('click', () => goReel(1));
    document.getElementById('source-chips').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const dom = chip.dataset.domain;
      const enabledCount = Object.keys(Recommender.weights).length - Recommender.disabled.size;
      if (Recommender.disabled.has(dom)) {
        Recommender.disabled.delete(dom);
      } else if (enabledCount > 1) {
        Recommender.disabled.add(dom);
        pruneDomainAhead(dom);
        showToast(`${dom} OFF`);
      } else {
        showToast('KEEP AT LEAST ONE SOURCE ON');
      }
      Recommender.save();
      Recommender.renderDrawer();
    });
    overlay.addEventListener('click', closeDrawer);

    document.fonts?.ready.then(() => {
      const st = streamEl.querySelector(`.reel[data-index="${State.activeReel}"] .stage`);
      if (st) fitStageToViewport(st, true);
    });
    document.addEventListener('visibilitychange', () => {
      const c = ContentAudio.ctx;
      if (!c) return;
      if (document.hidden) c.suspend().catch(() => {});
      else if (ContentAudio.enabled) c.resume().catch(() => {});
    });
    const savedListEl = document.getElementById('saved-list');
    const openSaved = (el) => { const u = el?.dataset.url; if (u) window.open(u, '_blank', 'noopener,noreferrer'); };
    savedListEl.addEventListener('click', (e) => openSaved(e.target.closest('.saved-card')));
    savedListEl.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.saved-card')) { e.preventDefault(); openSaved(e.target.closest('.saved-card')); }
    });

    /* =========================================================================
       9. BEAT TIMER LOOP
       ========================================================================= */
    let lastFrame = performance.now();

    function animate(now) {
      const dt = Math.min(now - lastFrame, 100);
      lastFrame = now;

      const active = State.reels[State.activeReel];
      if (active && !State.paused && !State.userPaused && !document.hidden && !drawer.classList.contains('open') && !shareModal.classList.contains('open')) {
        const beat = active.beats[State.activeBeat];
        const duration = beat?.ms || 4200;
        State.beatElapsed += dt;

        const fill = progressEl.children[State.activeBeat]?.firstChild;
        if (fill) {
          fill.style.width = Math.min(100, (State.beatElapsed / duration) * 100) + '%';
        }

        if (State.beatElapsed >= duration) {
          stepBeat(1);
        }
      }

      requestAnimationFrame(animate);
    }

    /* =========================================================================
       10. PROGRESSIVE STREAMING HARVEST & BOOT
       ========================================================================= */
    const bootEl = document.getElementById('boot-screen');
    let bootDismissed = false;

    function dismissBootScreen() {
      if (bootDismissed) return;
      bootDismissed = true;
      bootEl.classList.add('hidden');
      const whisper = document.getElementById('gesture-whisper');
      if (whisper && !localStorage.getItem('SCTHRA_whisper_seen')) {
        whisper.classList.add('show');
        const hideWhisper = () => {
          whisper.classList.remove('show');
          localStorage.setItem('SCTHRA_whisper_seen', '1');
        };
        setTimeout(hideWhisper, 4200);
        window.addEventListener('pointerdown', hideWhisper, { once: true });
      }
    }

    async function harvestNextWave() {
      if (State.fetching) return;
      State.fetching = true;
      try {
        // Retry with fresh source picks if a wave yields nothing (rate limits, dedupe, offline blips)
        for (let attempt = 0; attempt < 3; attempt++) {
          const incoming = [];
          let flushed = false;
          const flush = () => {
            if (!incoming.length) return;
            Recommender.rankBatch(incoming.splice(0)).forEach(r => appendReel(r));
          };
          // Don't hold finished reels hostage to the slowest API: release the buffer after 3.5s
          const timer = setTimeout(() => { flushed = true; flush(); }, 3500);
          const produced = await LiveWebIngestor.streamWave((reel) => {
            if (State.reels.length < 3) {
              appendReel(reel);
              dismissBootScreen();
            } else if (flushed) {
              appendReel(reel);
            } else {
              incoming.push(reel);
            }
          }, attempt === 0 ? 10 : 12);
          clearTimeout(timer);
          flush();
          if (produced > 0) break;
          await new Promise(r => setTimeout(r, 700 * (attempt + 1)));
        }
      } finally {
        State.fetching = false;
        dismissBootScreen();
      }
    }

    (async function boot() {
      SeenRegistry.init();
      Recommender.load();
      requestAnimationFrame(animate);
      await harvestNextWave();
      if (!State.reels.length) showEmptyState();
    })();

    function showEmptyState() {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;color:var(--ink-dim);text-align:center;padding:24px';
      el.innerHTML = '<div>NO LIVE FEEDS REACHABLE. CHECK YOUR CONNECTION.</div><button class="hud-btn primary-pill" type="button">RETRY</button>';
      document.body.appendChild(el);
      el.querySelector('button').addEventListener('click', async () => {
        el.remove();
        showToast('RETRYING FEEDS');
        await harvestNextWave();
        if (!State.reels.length) showEmptyState();
      });
    }
  </script>
</body>
